# Connect Talk — produção. Raspberry Pi do escritório: docs/raspberry-pi.md (bash deploy/instalar-pi.sh faz tudo).
# Outro PC ou VPS: docs/producao.md. Tudo a partir da pasta deploy/:
#   cp .env.example .env   (e preencha)
#   docker compose up -d --build          (o site aplica as migrations sozinho ao subir)
#   docker compose run --rm app php bin/setup.php --email=voce@connect.com.br --name="Seu nome"
#
# Entrada pela internet (COMPOSE_PROFILES no .env, ADR 0005):
#   tunnel  Cloudflare Tunnel (padrão no Pi): HTTPS sem abrir porta no roteador, funciona com CGNAT e sem IP fixo
#   caddy   HTTPS próprio (Let's Encrypt) com as portas 80 e 443 abertas para este aparelho
# Todas as imagens têm versão para ARM 64 bits (Raspberry Pi 4/5) e para PC.
name: talk-php   # não confundir com o Talk antigo em Node ("connect-talk")

x-logs: &logs
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }   # não enche o SSD/cartão do Pi com log

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    <<: *logs
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    # memória do banco: 256M cabe num Pi de 4 GB junto com o resto; num PC pode subir (DB_BUFFER_POOL=1G)
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=-03:00",
              "--innodb-buffer-pool-size=${DB_BUFFER_POOL:-256M}"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: connect-talk-php:latest
    restart: unless-stopped
    <<: *logs
    env_file: .env
    environment: { DB_HOST: db, DB_PORT: "3306", TRUST_PROXY: "1", APP_ENV: production,
                   EVOLUTION_URL: "http://whatsapp:8080", EVOLUTION_WEBHOOK_URL: "http://app" }
    volumes:
      - storage:/var/talk/storage
    depends_on: { db: { condition: service_healthy } }

  worker:
    image: connect-talk-php:latest
    restart: unless-stopped
    <<: *logs
    env_file: .env
    environment: { DB_HOST: db, DB_PORT: "3306", APP_ENV: production, RUN_MIGRATIONS: "0",
                   EVOLUTION_URL: "http://whatsapp:8080", EVOLUTION_WEBHOOK_URL: "http://app" }
    command: ["php", "bin/talk-worker"]
    user: www-data
    volumes:
      - storage:/var/talk/storage
    depends_on: { db: { condition: service_healthy }, app: { condition: service_started } }
    healthcheck:
      test: ["CMD", "php", "bin/talk-worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # motor do WhatsApp por QR Code (Evolution API, que usa o Baileys como o Atendechat).
  # Fica só na rede interna: o Talk cria a sessão de cada número e recebe as mensagens por webhook.
  whatsapp:
    image: evoapicloud/evolution-api:v2.3.6
    restart: unless-stopped
    <<: *logs
    environment:
      SERVER_URL: http://whatsapp:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?preencha EVOLUTION_API_KEY no .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${DB_PASSWORD}@whatsapp-db:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Connect Talk
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR,WARN
      TZ: America/Sao_Paulo
    volumes:
      - whatsapp_instances:/evolution/instances
    depends_on: { whatsapp-db: { condition: service_healthy } }

  # banco do motor do WhatsApp (sessões dos números); separado do banco do Talk
  whatsapp-db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logs
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - whatsapp_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  # HTTPS automático (Let's Encrypt) para o domínio; a Meta exige HTTPS no webhook
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    <<: *logs
    profiles: ["caddy"]
    ports: ["80:80", "443:443"]
    environment: { TALK_DOMAIN: "${TALK_DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  # HTTPS pela Cloudflare sem abrir porta (padrão no Raspberry Pi). No painel da Cloudflare, o Public Hostname do
  # túnel aponta TALK_DOMAIN para http://app:80. O WhatsApp oficial (Meta) e o Evolution chegam por aqui.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    <<: *logs
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]

  # IA local da Jack (docs/jack/IA.md, ADR 0004 etapa A): só entende o assunto da mensagem, não escreve.
  # Desligada por padrão: liga com COMPOSE_PROFILES=tunnel,ia e JACK_AI=shadow no .env, com o arquivo do
  # modelo (Gemma 3 1B, .gguf de ~1 GB) em deploy/ia/modelo.gguf. Só na rede interna; sem internet.
  jack-ia:
    image: ${JACK_AI_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    <<: *logs
    profiles: ["ia"]
    command: ["-m", "/models/modelo.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048", "-np", "1",
              "-t", "${JACK_AI_THREADS:-4}", "--cache-reuse", "256"]
    volumes:
      - ./ia:/models:ro

  # cópia de segurança diária do banco e dos arquivos (pasta deploy/backups no PC)
  backup:
    image: mariadb:11.4
    restart: unless-stopped
    <<: *logs
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: America/Sao_Paulo
    entrypoint: ["bash", "/scripts/backup.sh", "--loop"]
    volumes:
      - ./backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - storage:/storage:ro
    depends_on: { db: { condition: service_healthy } }

volumes:
  db:
  storage:
  whatsapp_db:
  whatsapp_instances:
  caddy_data:
  caddy_config:
