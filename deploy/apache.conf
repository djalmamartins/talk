# Connect Talk — Apache dentro do container (o HTTPS fica no Caddy, na frente)
<VirtualHost *:80>
    DocumentRoot /var/www/talk/public
    ServerSignature Off

    <Directory /var/www/talk/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # tempo real (SSE): sem compressão nem buffer em /events; a conexão fica aberta
    <Location /events>
        SetEnv no-gzip 1
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
ServerTokens Prod
