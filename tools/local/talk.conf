# Connect Talk — laboratório (talk.connect.lab) no dev-apache compartilhado
<VirtualHost *:80>
    ServerName talk.connect.lab
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName talk.connect.lab
    DocumentRoot /var/www/html/talk/public
    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/talk-connect.pem
    SSLCertificateKeyFile /etc/apache2/certs/talk-connect-key.pem

    <Directory /var/www/html/talk/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # tempo real (SSE): sem compressão nem buffer em /events
    <Location /events>
        SetEnv no-gzip 1
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/talk-error.log
    CustomLog ${APACHE_LOG_DIR}/talk-access.log combined
</VirtualHost>
